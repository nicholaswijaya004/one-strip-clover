# Pembaruan dependensi otomatis.
#
# Mingguan (bukan bulanan): patch keamanan tidak boleh menunggu sebulan.
# Patch & minor digabung jadi satu PR per ekosistem supaya tidak banjir —
# versi mayor tetap PR sendiri karena itu yang bisa merusak.
# Pembaruan KEAMANAN (Dependabot security updates) tetap datang seketika,
# terlepas dari jadwal ini — aktifkan di Settings → Code security.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 10
    labels: [dependensi]
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
    groups:
      produksi-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
      dev-minor-patch:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: "/backend-go"
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Jakarta
    labels: [dependensi, go]
    commit-message:
      prefix: "deps(go)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Jakarta
    labels: [ci]
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
