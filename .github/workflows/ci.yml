name: CI

# Jalan di setiap push ke main, setiap pull request, dan dipanggil ulang
# oleh workflow rilis (workflow_call) — rilis TIDAK boleh lolos tanpa
# semua pemeriksaan yang sama dengan PR.
#
# Job di sini = "required status checks" di aturan branch main
# (lihat .github/rulesets/main.json). Nama job JANGAN diganti tanpa
# memperbarui aturan itu — PR akan menggantung menunggu cek yang tidak ada.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

# Hak minimum. Tiap job meminta tambahan sendiri kalau perlu.
permissions:
  contents: read

# Batalkan run lama kalau ada push baru di branch yang sama —
# hemat waktu antre dan kuota. Push ke main tidak dibatalkan.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22"
  GO_VERSION: "1.27" # rilis Go yang masih didukung (1.26 / 1.27); govulncheck butuh ≥ 1.26

jobs:
  # ------------------------------------------------------------------ lint
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: ESLint (bug & keamanan JS)
        run: npm run lint

      - name: TypeScript strict (frontend-react)
        run: npm run typecheck

      - name: Tidak ada skrip inline di HTML (CSP melarangnya)
        run: |
          set -e
          gagal=0
          for f in public/*.html; do
            if grep -nE '<script>|<script [^>]*>[^<]+</script>| on[a-z]+="' "$f"; then
              echo "✗ $f punya skrip / handler inline — pindahkan ke public/js/"; gagal=1
            fi
          done
          exit $gagal

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false # tanpa dependensi eksternal (tidak ada go.sum)

      - name: gofmt & go vet
        working-directory: backend-go
        run: |
          set -e
          belum=$(gofmt -l .)
          if [ -n "$belum" ]; then echo "✗ belum di-gofmt:"; echo "$belum"; exit 1; fi
          go vet ./...

      - name: actionlint (workflow GitHub Actions)
        run: |
          set -e
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

  # ----------------------------------------------------------------- build
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Pasang dependensi produksi saja (seperti di server)
        run: npm ci --omit=dev

      - name: Periksa sintaks semua berkas JS
        run: |
          set -e
          for f in server.js lib/*.js lib/http/*.js scripts/*.js public/js/*.js public/shared/*.js; do
            node --check "$f"
          done
          echo "✓ sintaks aman"

      - name: Semua modul server bisa dimuat tanpa devDependencies
        run: node -e 'for (const m of ["./lib/images","./lib/env","./lib/limiter","./lib/http/middleware","./lib/http/admin-routes","./lib/delivery","./lib/render"]) require(m); console.log("✓ modul termuat")'

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false # tanpa dependensi eksternal (tidak ada go.sum)

      - name: go build
        working-directory: backend-go
        run: go build ./...

  # ------------------------------------------------------------------ test
  test:
    name: test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 22 = LTS yang dipakai produksi, 24 = LTS berikutnya (siap upgrade)
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Tes unit + HTTP + ambang cakupan
        run: npm run test:coverage

      - name: Simulasi browser (halaman photobox benar-benar hidup)
        run: |
          npm run sim
          UJI_TEMPLATE=1 npm run sim

  # ---------------------------------------------------------------- go-test
  go-test:
    name: go-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false # tanpa dependensi eksternal (tidak ada go.sum)
      - name: go test -race
        working-directory: backend-go
        run: go test -race -count=1 ./...

  # ----------------------------------------------------------- integration
  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Pasang dependensi produksi saja (seperti di server)
        run: npm ci --omit=dev

      # Server SUNGGUHAN, NODE_ENV=production, diserang dari luar:
      # header keamanan, kontrol akses, anti-DoS, anti tebak-kode.
      - name: Smoke test produksi
        run: bash scripts/smoke-test.sh

  # -------------------------------------------------------------- security
  audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: npm audit (dependensi produksi, moderate ke atas)
        run: npm audit --omit=dev --audit-level=moderate

      - name: Tanda tangan paket npm terverifikasi
        run: |
          npm ci --ignore-scripts
          npm audit signatures

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false # tanpa dependensi eksternal (tidak ada go.sum)

      - name: govulncheck (Go)
        working-directory: backend-go
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  secrets:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # seluruh riwayat — rahasia yang "sudah dihapus" tetap bocor
          persist-credentials: false

      - name: Pastikan berkas terlarang tidak terlacak git
        run: |
          set -e
          gagal=0
          # Berkas yang TIDAK BOLEH ada di repo
          for pola in ".env" "data/codes.json" "data/settings.json" "data/orders.log"; do
            if git ls-files --error-unmatch "$pola" > /dev/null 2>&1; then
              echo "✗ $pola ikut ter-commit — hapus dengan: git rm --cached $pola"
              gagal=1
            else
              echo "✓ $pola tidak terlacak"
            fi
          done
          # folder data sama sekali tidak boleh berisi berkas terlacak selain .gitkeep
          berkasData=$(git ls-files data/ | grep -v '.gitkeep' || true)
          if [ -n "$berkasData" ]; then
            echo "✗ ada berkas data ikut ter-commit:"; echo "$berkasData"; gagal=1
          fi
          exit $gagal

      - name: Cari pola rahasia khas proyek ini
        run: |
          set -e
          # token refresh Google diawali 1//, kunci API Google AIza, kunci Anthropic sk-ant-
          pola='(1//[0-9A-Za-z_-]{20,}|AIza[0-9A-Za-z_-]{30,}|sk-ant-[0-9A-Za-z_-]{20,})'
          if git grep -nIE "$pola" -- ':!*.md' ':!package-lock.json' > /tmp/temuan.txt 2>/dev/null; then
            echo "✗ kemungkinan rahasia tertulis di kode:"
            cat /tmp/temuan.txt
            exit 1
          fi
          echo "✓ tidak ditemukan pola rahasia"

      - name: Gitleaks (seluruh riwayat git)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  # ---------------------------------------------------------- satu gerbang
  # Satu cek yang dijadikan "required" di aturan branch. Kalau nanti job
  # ditambah/diganti nama, cukup ubah daftar `needs` di sini — aturan
  # branch tidak perlu disentuh.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [lint, build, test, go-test, integration, audit, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Semua job wajib lulus
        env:
          HASIL: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$HASIL"
          if echo "$HASIL" | grep -qE '"(failure|cancelled|skipped)"'; then
            echo "✗ ada job yang tidak lulus"; exit 1
          fi
          echo "✓ semua pemeriksaan lulus"
