name: Asisten Claude

# Panggil @claude di komentar issue atau PR untuk minta bantuan:
# menjelaskan kode, memperbaiki bug kecil, menulis tes, dsb.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

# Hak bawaan minimum; job di bawah meminta yang ia perlukan saja.
permissions:
  contents: read

jobs:
  assist:
    # Hanya jalan kalau ada sebutan @claude DAN yang memanggil adalah pemilik /
    # anggota / kolaborator repo. Repo ini publik: tanpa syarat kedua, orang
    # asing bisa menyuruh bot yang punya hak tulis (prompt injection) sekaligus
    # menghabiskan kuota API berbayar.
    if: |
      (
        contains(github.event.comment.body, '@claude') ||
        contains(github.event.issue.body, '@claude') ||
        contains(github.event.review.body, '@claude')
      ) && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
        github.event.comment.author_association ||
        github.event.issue.author_association ||
        github.event.review.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ADA_KUNCI: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write

    steps:
      # Tanpa secret ANTHROPIC_API_KEY, lewati dengan pemberitahuan jelas
      # (bukan merah di setiap PR). Pasang di Settings → Secrets and
      # variables → Actions, dan job ini otomatis aktif.
      - name: Kunci API Claude belum dipasang — dilewati
        if: env.ADA_KUNCI != 'true'
        run: echo "::notice title=Claude dilewati::Secret ANTHROPIC_API_KEY belum dipasang di repo ini."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.ADA_KUNCI == 'true'
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@756cc22e19660d20e8cc9496b4f242475a7f7790 # v1.0.235
        if: env.ADA_KUNCI == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --max-turns 20
