# Pembaruan dependensi otomatis.
# Dibatasi bulanan supaya tidak membanjiri repo dengan PR kecil.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: [dependensi]
    # Patch & minor digabung jadi satu PR — yang penting versi mayor,
    # karena itu yang bisa merusak (mis. Node 18 → 20).
    groups:
      minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels: [ci]
